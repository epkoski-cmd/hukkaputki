<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <!-- Tämä rivi saa sivun skaalautumaan oikein puhelimella -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hukkaputki – lähiöbaarit metron varrella</title>
  <meta name="description" content="Lähiöbaarit ja piilohelmet Länsimetron varrella – Aalto-yliopistolta Finnooseen.">

  <!-- Selaimen välilehden ikoni ja puhelimen kotinäytön ikoni -->
  <link rel="icon" href="kuvat/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="kuvat/apple-touch-icon.png">

  <!-- Open Graph: mitä WhatsApp, Facebook ym. näyttävät, kun linkki jaetaan.
       Kuvan osoitteen pitää olla täydellinen (https://...). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hukkaputki">
  <meta property="og:title" content="Hukkaputki – lähiöbaarit metron varrella">
  <meta property="og:description" content="Jää pois, kävele hetki, löydä jotain uutta. Lähiöbaarit ja piilohelmet Länsimetron varrella.">
  <meta property="og:url" content="https://epkoski-cmd.github.io/hukkaputki/">
  <meta property="og:image" content="https://epkoski-cmd.github.io/hukkaputki/kuvat/jakokuva.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hukkaputki-logo: metrolinja muuttuu putkeksi, jonka päällä kuohuu oluen vaahto">
  <meta property="og:locale" content="fi_FI">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Leaflet: ilmainen karttakirjasto. "integrity" varmistaa, että tiedosto on aito. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <!-- Kielinapit. app.js vaihtaa kielen ja merkitsee valitun napin. -->
    <nav class="lang-switch" aria-label="Kieli / Language">
      <button type="button" data-kieli="fi" lang="fi">FI</button>
      <button type="button" data-kieli="en" lang="en">EN</button>
    </nav>
    <h1><img class="logo" src="kuvat/logo.svg" alt="Hukkaputki" width="1120" height="330"></h1>
    <!-- Tekstit, joissa on data-teksti, täytetään kielet.js:stä valitulla kielellä. -->
    <p class="tagline" data-teksti="iskulause">Lähiöbaarit metron varrella. Jää pois, kävele hetki, löydä jotain uutta.</p>
  </header>

  <main>
    <!-- Suodatinnapit. app.js täyttää tämän tagien perusteella. -->
    <section class="filters" aria-label="Suodattimet">
      <p class="filters-title" data-teksti="mitaEtsit">Mitä etsit?</p>
      <div id="filter-buttons"></div>
    </section>

    <!-- Asemat ja niiden baarit. app.js täyttää tämän. -->
    <section id="line" aria-label="Metroasemat"></section>
  </main>

  <!-- Alatunnisteen tekstit tulevat kielet.js:stä (kohta "alatunniste"). -->
  <footer id="footer"></footer>

  <!-- Ensin karttakirjasto ja data, sitten sovelluslogiikka.
       ?v=4 on versionumero: kasvata sitä aina, kun muutat tiedostoja, niin
       selain hakee uudet versiot eikä käytä vanhoja välimuistista. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data.js?v=4"></script>
  <script src="kielet.js?v=4"></script>
  <script src="app.js?v=4"></script>

  <!-- GoatCounter: yksityisyyttä kunnioittava kävijätilasto, ei evästeitä.
       Ei laske käyntejä localhostista. https://www.goatcounter.com -->
  <script data-goatcounter="https://hukkaputki.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
