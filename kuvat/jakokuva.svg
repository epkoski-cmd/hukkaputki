<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Hukkaputken jakokuva (Open Graph). Muokkaa tätä ja aja kuvat/tee-png.sh
       Koko logo on keskimmäisessä 630 × 630 neliössä (x 285–915), koska
       WhatsApp näyttää pienessä esikatselussa vain sen. -->
  <rect width="1200" height="630" fill="#faf8f5"/>
  <g transform="translate(-8 0)">

  <!-- Metrolinja, joka paisuu putkeksi -->
  <path d="M300 293 H380 C412 293 418 235 465 235 H835 A65 65 0 0 1 835 365 H465 C418 365 412 307 380 307 H300 Z" fill="#ff6319"/>

  <!-- Asemapallot -->
  <g fill="#faf8f5" stroke="#ff6319" stroke-width="7">
    <circle cx="316" cy="300" r="14"/>
    <circle cx="362" cy="300" r="14"/>
  </g>

  <!-- Sana putken sisällä -->
  <text x="660" y="329" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="80" font-weight="800" letter-spacing="-2" fill="#ffffff">Hukkaputki</text>

  <!-- Vaahto putken oikeassa yläkulmassa (samat kuplat kuin logossa, pienennettynä) -->
  <g transform="translate(167.5 91.75) scale(0.65)" fill="#ffffff" stroke="#ff6319" stroke-width="8">
    <circle cx="1000" cy="222" r="30"/><circle cx="1045" cy="210" r="34"/>
    <circle cx="1092" cy="226" r="28"/><circle cx="960" cy="228" r="20"/>
    <circle cx="1126" cy="252" r="20"/>
    <circle cx="1020" cy="176" r="24"/><circle cx="1066" cy="168" r="20"/>
    <circle cx="1106" cy="186" r="16"/><circle cx="982" cy="190" r="14"/>
    <circle cx="1044" cy="136" r="14"/><circle cx="1084" cy="140" r="11"/>
    <circle cx="1010" cy="146" r="9"/><circle cx="1122" cy="158" r="9"/>
    <circle cx="1064" cy="108" r="7"/><circle cx="1030" cy="112" r="5"/>
    <circle cx="1100" cy="116" r="5"/><circle cx="1140" cy="130" r="4"/>
    <circle cx="944" cy="200" r="6"/>
  </g>

  </g>

  <text x="600" y="455" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="32" fill="#6b6b66">Lähiöbaarit metron varrella</text>
</svg>
